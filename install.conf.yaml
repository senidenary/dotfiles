- clean: ['~']

- shell:
    - [git submodule update --init --recursive, Updating submodules]

- link:
    ~/.vimrc: vimrc
    ~/.config/helix/config.toml:
        create: true
        path: helix/config.toml
    ~/.zshrc: zshrc
    ~/.zsh_aliases: zsh_aliases
    ~/.antidote: modules/antidote
    ~/.zsh_plugins.txt: zsh_plugins.txt
    ~/.p10k.zsh: p10k.zsh
    ~/.config/gitui/key_bindings.ron:
        create: true
        path: gitui/key_bindings.ron
    ~/.config/alacritty/alacritty.toml:
        create: true
        path: alacritty.toml
    ~/.config/fastfetch/config.jsonc:
        create: true
        path: fastfetch/config.jsonc
    ~/.git-commit-template: git-commit-template

- shell:
    - git config --global commit.template ~/.git-commit-template
    - git config --global alias.lg "log --graph --abbrev-commit --decorate --format=format:'%C(bold cyan)%h%C(reset) %C(bold green)(%ar)%C(reset)%C(auto)%d%C(reset)%n%C(white)%s%C(reset) %C(dim white)[%an]%C(reset)%n'"
    - git config --global alias.fc '!f() { fuzzy_git_branch="" && fuzzy_git_branch=$(git branch | fzf | tr -d "* ") && [ ! $fuzzy_git_branch = "" ] && git checkout $fuzzy_git_branch; }; f'
    - git config --global alias.fcr '!f() { fuzzy_git_branch="" && fuzzy_git_branch=$(git branch --remotes | fzf | tr -d "* ") && [ ! $fuzzy_git_branch = "" ] && git checkout -t $fuzzy_git_branch; }; f'

